# SonarQube Project Configuration
# Defines analysis rules for both frontend (Nuxt) and backend (Express)

sonar.projectKey=Bloomora
sonar.projectName=Bloomora (Nuxt 3 + Express Full-Stack)
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=frontend,backend/src

# Test directories
sonar.tests=frontend,backend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/dist/**,\
  **/.husky/**,\
  **/.scannerwork/**,\
  **/coverage/**,\
  **/*.d.ts,\
  frontend/public/**

# TypeScript Configuration Files
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,backend/tsconfig.json

# Quality Gates & Rules
sonar.javascript.environments=browser,node
sonar.javascript.node.maxspace=4096
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info,frontend/coverage/lcov.info,backend/coverage/lcov.info
