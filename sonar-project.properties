# SonarQube configuration for the Bloomora monorepo (Nuxt frontend + Express backend)

sonar.projectKey=Bloomora
sonar.projectName=Bloomora (Nuxt 3 + Express + PostgreSQL)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=frontend,backend/src
sonar.exclusions=\
  **/node_modules/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  frontend/public/**

# Tests: none yet. When added, keep them out of `sonar.sources` via these patterns.
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Seed fixtures are intentionally repetitive data, not logic.
sonar.cpd.exclusions=backend/src/db/seeds/data/**,**/*.spec.ts,**/*.test.ts

sonar.typescript.tsconfigPaths=frontend/tsconfig.json,backend/tsconfig.json
sonar.javascript.environments=browser,node
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
